<script>
/* Apply saved design tokens before first paint so a customised theme never
   flashes the defaults. theme.js is the source of truth; this only replays
   the last known values from localStorage. */
(function () {
  var root = document.documentElement;
  var mode = 'system';   // follow the operating system on first visit
  try {
    var raw = localStorage.getItem('lit-picks-theme');
    if (raw) {
      var saved = JSON.parse(raw);
      if (saved.mode === 'light' || saved.mode === 'dark' || saved.mode === 'system') mode = saved.mode;
      Object.keys(saved.tokens || {}).forEach(function (k) {
        var v = saved.tokens[k];
        if (typeof v === 'string' && v) root.style.setProperty(k, v);
      });
    }
  } catch (_) { /* a bad cache must never stop the app booting */ }
  try {
    root.dataset.theme = (mode === 'dark'
      || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
      ? 'dark' : 'light';
  } catch (_) { root.dataset.theme = 'light'; }
})();
</script>
