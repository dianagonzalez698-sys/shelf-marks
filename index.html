<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="A personal reading journal. Log what you finish, collect bookmarks.">

<!-- Home-screen app on iPhone / iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lit Picks">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f6f1e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1713" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap">

<link rel="stylesheet" href="./css/styles.css">

<script>
/* Apply saved design tokens before first paint so a customised theme never
   flashes the defaults. theme.js is the source of truth; this only replays
   the last known values from localStorage. */
(function () {
  try {
    const raw = localStorage.getItem('lit-picks-theme');
    if (!raw) return;
    const saved = JSON.parse(raw);
    const root = document.documentElement;
    Object.entries(saved.tokens || {}).forEach(([k, v]) => {
      if (typeof v === 'string' && v) root.style.setProperty(k, v);
    });
  } catch (_) { /* a bad cache must never stop the app booting */ }
})();
</script>
</head>
<body>

<a class="skip-link" href="#app">Skip to content</a>

<header class="masthead" id="masthead">

    </button>

    <nav class="masthead-nav" id="masthead-nav" aria-label="Sections">
      <a class="masthead-link" href="#/challenges" data-tab="challenges" data-content="navChallenges">Reading Challenges</a>
      <a class="masthead-link" href="#/books" data-tab="books" data-content="navBooks">My Books</a>
      <a class="masthead-link" href="#/bookmarks" data-tab="bookmarks" data-content="navBookmarks">Archive</a>
      <a class="masthead-link masthead-link-quiet" href="#/settings" data-tab="settings" data-content="navSettings">Settings</a>
    </nav>

  </div>
</header>

<div class="alert-banner" id="storage-banner" hidden role="alert"></div>

</section>

<main id="app" class="screen" tabindex="-1">

</main>

<nav class="tabbar" id="tabbar" aria-label="Main">

  <a class="tab" href="#/books" data-tab="books">

    <span data-content="navBooks">My Books</span>

  <a class="tab" href="#/challenges" data-tab="challenges">

</html>
