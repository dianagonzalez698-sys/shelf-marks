<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf Marks</title>
<meta name="description" content="A personal 2027 reading challenge tracker. Log what you finish, collect bookmarks.">

<!-- Home-screen app on iPhone / iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shelf Marks">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<a class="skip-link" href="#app">Skip to content</a>

<header class="appbar" id="appbar">
  <div class="appbar-inner">
    <button class="appbar-back" id="appbar-back" type="button" hidden aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="appbar-title" id="appbar-title">Shelf Marks</h1>
    <div class="appbar-actions" id="appbar-actions"></div>
  </div>
</header>

<div class="banner" id="storage-banner" hidden role="alert"></div>

<main id="app" class="screen" tabindex="-1">
  <p class="loading">Opening your shelf…</p>
</main>

<nav class="tabbar" id="tabbar" aria-label="Main">
  <a class="tab" href="#/" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>Home</span>
  </a>
  <a class="tab" href="#/books" data-tab="books">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h5a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H5zM19 4h-5a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>Books</span>
  </a>
  <a class="tab" href="#/challenges" data-tab="challenges">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM12 13v4M9 21h6M16 5h3v2a3 3 0 0 1-3 3M8 5H5v2a3 3 0 0 0 3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Challenges</span>
  </a>
  <a class="tab" href="#/bookmarks" data-tab="bookmarks">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-5-4-5 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>Bookmarks</span>
  </a>
  <a class="tab" href="#/settings" data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>Settings</span>
  </a>
</nav>


<a class="fab" href="#/add" id="fab" aria-label="Add a book">
  <svg viewBox="0 0 24 24" aria-hidden="true" width="26" height="26"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  <span class="fab-label">Add a book</span>
</a>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<div class="sheet-host" id="sheet-host" hidden></div>

<noscript>
  <p style="padding:1.5rem">Shelf Marks needs JavaScript — it keeps all of your reading data on this device.</p>
</noscript>

<script type="module" src="./js/app.js"></script>
</body>
</html>
